[project]
name = "espaces-ouverts"
version = "0.1.0"
description = "Espaces Ouverts - Association Directory Platform"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Espaces Ouverts Team", email = "stephane@garagnani.fr"}
]

dependencies = [
    "asgiref==3.12.1",
    "Django==6.1",
    "django-debug-toolbar==7.1.1",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.3.1",
    "sqlparse==0.6.0",
    "typing-extensions==4.16.0",
    "django-tailwind-4==0.1.4",
    "django-browser-reload==1.21.0",
    "django-storages[s3]==1.14.4",
    "boto3>=1.35.0",
    "pillow>=10.4.0",
    "django-environ",
    "gunicorn",
    "whitenoise",
    "dj-static",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = []

